name: Deploy Sam's site

# Publishes the app to EAS Hosting at https://sam-one-horizon-homes.expo.app
#
# One-time setup (no terminal needed) — add these GitHub repo secrets under
# Settings -> Secrets and variables -> Actions -> "New repository secret":
#   1. EXPO_TOKEN                   from https://expo.dev/settings/access-tokens
#   2. EXPO_PUBLIC_SUPABASE_URL     your Supabase Project URL   (Project Settings -> API)
#   3. EXPO_PUBLIC_SUPABASE_ANON_KEY your Supabase anon/public key (same page)
# See SETUP.md for the full walkthrough. The site still deploys without the
# Supabase secrets, but shows a "connect the backend" screen until they're set.

on:
  push:
    branches:
      - claude/admin-site-replicas-sam-u6yh8n
      - claude/onehorizonhomes-web-app-1mt7ox
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to EAS Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify the EXPO_TOKEN secret is present
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          echo "EXPO_TOKEN is set. Authenticated as:"
          eas whoami

      - name: Check the Supabase connection secrets
        run: |
          if [ -z "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" ] || [ -z "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::Supabase secrets are not set yet. The site will deploy but show the 'connect the backend' screen. Add EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (see SETUP.md), then re-run."
          else
            echo "Supabase connection secrets are present."
          fi

      - name: Export the web bundle
        # EXPO_PUBLIC_* vars are baked into the bundle at build time, so they
        # must be present during export.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web

      - name: Deploy to production (with retries for first-time hosting provisioning)
        run: |
          set +e
          attempt=0
          max=6
          until [ $attempt -ge $max ]; do
            attempt=$((attempt+1))
            echo "::group::Deploy attempt $attempt of $max"
            eas deploy --prod --non-interactive
            code=$?
            echo "::endgroup::"
            if [ $code -eq 0 ]; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed (exit $code). EAS Hosting may still be provisioning storage for this new account; waiting 25s before retrying..."
            sleep 25
          done
          echo "::error::Deploy did not succeed after $max attempts."
          exit 1

      - name: Done
        run: echo "Deployed. Your site should be live at https://sam-one-horizon-homes.expo.app"
