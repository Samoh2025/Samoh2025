name: Deploy Sam's site

# Publishes the app to EAS Hosting at https://sam-one-horizon-homes.expo.app
#
# One-time setup (no terminal needed):
#   1. Create a free Expo account at https://expo.dev
#   2. Make an access token at https://expo.dev/settings/access-tokens
#   3. In this GitHub repo: Settings -> Secrets and variables -> Actions ->
#      "New repository secret", name it EXPO_TOKEN, paste the token, Save.
#   4. This workflow then runs automatically on every push, or you can start it
#      from the Actions tab. The first run creates the Expo project for you.

on:
  push:
    branches: [claude/admin-site-replicas-sam-u6yh8n]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to EAS Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify the EXPO_TOKEN secret is present
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          echo "EXPO_TOKEN is set. Authenticated as:"
          eas whoami

      - name: Export the web bundle
        run: npx expo export --platform web

      - name: Deploy to production (with retries for first-time hosting provisioning)
        run: |
          set +e
          attempt=0
          max=6
          until [ $attempt -ge $max ]; do
            attempt=$((attempt+1))
            echo "::group::Deploy attempt $attempt of $max"
            eas deploy --prod --non-interactive
            code=$?
            echo "::endgroup::"
            if [ $code -eq 0 ]; then
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed (exit $code). EAS Hosting may still be provisioning storage for this new account; waiting 25s before retrying..."
            sleep 25
          done
          echo "::error::Deploy did not succeed after $max attempts."
          exit 1

      - name: Done
        run: echo "Deployed. Your site should be live at https://sam-one-horizon-homes.expo.app"
